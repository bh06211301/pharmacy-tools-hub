<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藥局業務工具入口</title>
<style>
:root {
  --bg:#f5f6fa;--white:#fff;--border:#e4e7f0;
  --accent:#3b6ef5;--accent-light:#eef2ff;
  --purple:#7c3aed;
  --text:#101828;--muted:#667085;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 8px rgba(16,24,40,.08),0 2px 4px rgba(16,24,40,.06);
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  padding:24px 16px 48px;
}
.header{max-width:560px;margin:0 auto 24px;text-align:center}
.header h1{font-size:20px;font-weight:700}
.header p{font-size:13px;color:var(--muted);margin-top:4px}
.grid{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{
  display:flex;align-items:center;gap:14px;
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);
  transition:box-shadow .15s,transform .15s;
}
.card:active{transform:scale(.98)}
.card:hover{box-shadow:var(--shadow-md)}
.icon{
  width:44px;height:44px;flex-shrink:0;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.card .label{font-size:15px;font-weight:600}
.card .desc{font-size:12px;color:var(--muted);margin-top:2px}
.group-title{font-size:12px;color:var(--muted);font-weight:600;margin:20px 0 4px;padding-left:4px}
.group-title:first-of-type{margin-top:0}
</style>
</head>
<body>
  <div class="header">
    <h1>藥局業務工具入口</h1>
    <p>點選卡片直接開啟對應工具</p>
  </div>
  <div class="grid">
    <div class="group-title">藥局業務智能規劃</div>
    <a class="card" href="https://bh06211301.github.io/pharmacy-smart-board/">
      <div class="icon">📅</div>
      <div>
        <div class="label">排程規劃</div>
        <div class="desc">月曆排程、拜訪紀錄、AI 話術、待辦清單</div>
      </div>
    </a>
    <a class="card" href="https://bh06211301.github.io/pharmacy-smart-board/field.html">
      <div class="icon">🚶</div>
      <div>
        <div class="label">外勤模式</div>
        <div class="desc">行動版，今日推薦行程</div>
      </div>
    </a>
    <a class="card" href="https://bh06211301.github.io/pharmacy-smart-board/tasks-page.html">
      <div class="icon">🗺️</div>
      <div>
        <div class="label">路線規劃</div>
        <div class="desc">地圖選店、路線計算、油費估算</div>
      </div>
    </a>
    <a class="card" href="https://bh06211301.github.io/pharmacy-smart-board/inventory.html">
      <div class="icon">📦</div>
      <div>
        <div class="label">盤點登記</div>
        <div class="desc">手機盤點，選藥局後逐項填數量</div>
      </div>
    </a>
    <a class="card" href="https://bh06211301.github.io/pharmacy-smart-board/pharmacy-profile.html">
      <div class="icon">🏪</div>
      <div>
        <div class="label">藥局資訊總覽</div>
        <div class="desc">基本資料、拜訪/出貨/退貨/盤點紀錄</div>
      </div>
    </a>

    <div class="group-title">拜訪紀錄</div>
    <a class="card" href="https://bh06211301.github.io/pharmacy-visit-app/">
      <div class="icon">🎙️</div>
      <div>
        <div class="label">拜訪紀錄 App</div>
        <div class="desc">AI 對話式拜訪紀錄</div>
      </div>
    </a>
  </div>
</body>
</html>
